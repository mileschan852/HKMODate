name: Build and deploy HKMO Date Pages

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/validate-pages-site.mjs"
      - ".github/workflows/pages.yml"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/validate-pages-site.mjs"
      - ".github/workflows/pages.yml"
      - "README.md"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the main branch after Pages is configured for GitHub Actions
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hkmodate-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out HKMO Date
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Validate the public shell and launch URLs
        run: node scripts/validate-pages-site.mjs
      - name: Upload the docs folder as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/
          include-hidden-files: true

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && vars.HKMODATE_PAGES_ACTIONS_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages metadata without enabling Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: false
      - name: Deploy the approved Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
